name: Deploy site

# Builds the Astro site and publishes dist/ to gh-pages/docs, which is the
# existing GitHub Pages source for this repo (legacy branch deploy, custom
# domain www.felixhaba.com via public/CNAME).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # .env is gitignored, so CI has no token unless we pass one here.
          # A Mixpanel *project token* is a public client-side identifier (it
          # ships in the built HTML), so it's fine in plain text. Without this,
          # Analytics.astro renders nothing and prod ships zero tracking.
          PUBLIC_MIXPANEL_TOKEN: cda90d97d93ca1295299dbba88d19b8f

      - name: Publish to gh-pages/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: docs
